# 运营助手 MVP 本地真实模式；只对开发租户 dev 启用。
[pipeline]
intent_pipeline_version = "intent-v2"
research_pipeline_version = "research-v2"
runtime_mode = "local_live"
research_replan_enabled = true
research_decision_mode = "model"
research_source_allowlist = ["google_blog_rss", "langgraph_releases_atom", "hacker_news_api"]
research_policy_version = "research-policy/operations-mvp-1"
state_backend = "memory"
rollout_mode = "tenant_allowlist"
rollout_tenant_allowlist = ["dev"]
