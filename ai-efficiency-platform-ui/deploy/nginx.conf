# Set root to the unpacked release dist directory and the upstream to your Java service.
# Validate with nginx -t in the target environment before enabling this server.
server {
    listen 80;
    server_name _;
    root /srv/efficiency-platform/current/dist;
    index index.html;
    # Match this cap to the Java multipart policy before deployment.
    client_max_body_size 50m;

    location = /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location ^~ /api/ {
        # No trailing slash: preserve the /api prefix and the original query string.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /assets/ {
        # Append assets from every retained release here BEFORE switching current.
        # /srv/efficiency-platform/shared/assets/<content-hash>.js stays reachable.
        root /srv/efficiency-platform/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:js|mjs|css|json|map|svg|png|jpe?g|gif|ico|woff2?|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
